[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.121.3", "pydantic==2.12.4", "httpx==0.28.1", "uvicorn==0.38.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
