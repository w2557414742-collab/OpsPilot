name: Verify OpsPilot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: agent-python/requirements.lock
      - name: Build Java and run JUnit
        run: mvn -B -ntp -f backend-java/pom.xml verify
      - name: Install Python lock and run pytest
        run: |
          python -m pip install -r agent-python/requirements.lock
          python -m pytest agent-python
      - name: Start disposable test services
        run: |
          password=$(openssl rand -hex 24)
          printf '::add-mask::%s\n' "$password"
          export OPSPILOT_DB_PASSWORD="$password"
          printf 'OPSPILOT_DB_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          docker compose --profile alert-cache up -d --wait mysql redis
      - name: Verify Java, Python, MySQL and Redis
        env:
          OPSPILOT_DB_USER: opspilot
          OPSPILOT_DB_URL: jdbc:mysql://127.0.0.1:13316/opspilot
        run: |
          python scripts/verify_phase1.py --output ci-evidence/phase1
          python scripts/verify_phase2.py --output ci-evidence/phase2
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opspilot-verification
          path: |
            ci-evidence/*/*.log
            ci-evidence/*/snapshot.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop test services
        if: always() && env.OPSPILOT_DB_PASSWORD != ''
        run: docker compose --profile alert-cache stop mysql redis
