name: opspilot
services:
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    environment:
      MYSQL_DATABASE: opspilot
      MYSQL_USER: opspilot
      MYSQL_PASSWORD: ${OPSPILOT_DB_PASSWORD:?Set OPSPILOT_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${OPSPILOT_DB_PORT:-13316}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 768m
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_PASSWORD} mysql -h 127.0.0.1 -u opspilot opspilot -Nse 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    profiles: [alert-cache]
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${OPSPILOT_REDIS_PORT:-16379}:6379"
    mem_limit: 128m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
volumes:
  mysql-data:
